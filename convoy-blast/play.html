  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: #111520;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .banner {
      width: 100%;
      display: block;
    }
    .content {
      padding: 24px 20px 28px;
    }
    h1 {
      font-size: 26px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #ffb703;
    }
    .sub {
      color: #b0b8c8;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn-play {
      background: linear-gradient(135deg, #ff5400, #ff8800);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 84, 0, 0.4);
    }
    .btn-pc {
      background: #1e2638;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-ios {
      background: #161b26;
      color: #8b95a8;
      border: 1px dashed rgba(255,255,255,0.15);
      cursor: default;
    }
    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #6c7588;
    }
    .footer a { color: #9aa5b8; text-decoration: none; }
    .status-msg {
      display: none;
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 183, 3, 0.12);
      color: #ffd166;
      font-size: 14px;
    }
  </style>
  <script>
    const PLAY_URL = "https://play.google.com/store/apps/details?id=com.games105.convoyblast";
    window.addEventListener("DOMContentLoaded", () => {
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const msgEl = document.getElementById("status-msg");
      if (isAndroid) {
        if (msgEl) {
          msgEl.style.display = "block";
          msgEl.innerText = "Redirecting to Google Play Store... | جاري تحويلك إلى متجر Google Play...";
        }
        setTimeout(() => { window.location.href = PLAY_URL; }, 600);
      } else if (isIOS) {
        if (msgEl) {
          msgEl.style.display = "block";
          msgEl.innerText = "iOS version for iPhone & iPad is coming very soon! You can play now on Android or PC.";
        }
      }
    });
  </script>
</head>
<body>
  <div class="card">

    <div class="content">

      <p class="sub">100 Stages • 10 Giant Bosses • 5 Armored War-Trucks<br>قُد قافلتك المدرعة عبر 100 مرحلة و10 زعماء عمالقة!</p>
      <div id="status-msg" class="status-msg"></div>
      <div class="btns">
        <a class="btn btn-play" href="https://play.google.com/store/apps/details?id=com.games105.convoyblast">
          <span>📲 Download Free on Google Play (Android)</span>
        </a>
        <a class="btn btn-pc" href="https://play.google.com/store/apps/details?id=com.games105.convoyblast">
          <span>💻 Play on PC (Google Play Games)</span>
        </a>
        <div class="btn btn-ios">
          <span>🍎 App Store (iPhone / iPad) — Coming Soon</span>
        </div>
      </div>
      <div class="footer">
        <a href="../">105GAMES Official Hub</a> • <a href="privacy.html">Privacy Policy</a>
      </div>
    </div>
  </div>
</body>
</html>
